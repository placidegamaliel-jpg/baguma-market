name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: apk-build
        run: |
          npm install

      - name: Add Android platform
        working-directory: apk-build
        run: |
          npx cap add android

      - name: Sync web assets
        working-directory: apk-build
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: apk-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baguma-market-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
