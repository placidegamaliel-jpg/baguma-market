{% extends "base.html" %}
{% block body %}
<div class="topbar"><button class="menu-btn" onclick="toggleNav()">☰</button><h1>👮 Utilisateurs</h1><a href="/logout" style="color:var(--red);font-size:12px">✕</a></div>
<nav class="nav" id="mainNav">
<a href="/dashboard">📊 Dashboard</a><a href="/tenants">🏢 Tenants</a><a href="/utilisateurs" class="active">👮 Users</a><a href="/logs">📝 Logs</a><a href="/settings">⚙️ Parametres</a>
</nav>
<div class="container">
<div class="card" style="padding:0"><div class="table-scroll">
<table>
<tr><th>Login</th><th>Role</th><th>Tenant</th></tr>
{% for u in users %}
<tr>
<td>{{u.login}}</td>
<td class="{{'tag-entree' if u.role=='admin' else ''}}">{{u.role}}</td>
<td style="color:var(--txt2)">{{u.nom or 'Global'}}</td>
</tr>
{% endfor %}
</table></div></div>
<div class="footer">Baguma Market &copy; 2026</div>
</div>{% endblock %}
