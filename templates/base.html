<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baguma Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b1a;--card:#1a1a3e;--gold:#b8860b;--gold2:#f0d078;--green:#00b894;--red:#e63946;--blue:#0984e3;--txt:#f5f5f5;--txt2:#a0a0b0;--hon:#e84393}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
a{color:var(--gold2);text-decoration:none}
.topbar{background:var(--card);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--gold)}
.topbar h1{font-size:16px;color:var(--gold2)}
.topbar .menu-btn{background:none;border:none;color:var(--gold2);font-size:22px;cursor:pointer}
.nav{background:#12122a;padding:8px 0;display:none;position:sticky;top:52px;z-index:99;border-bottom:1px solid var(--gold)}
.nav.active{display:block}
.nav a{display:block;padding:12px 20px;color:var(--txt);font-size:14px;border-bottom:1px solid #1e1e40}
.nav a:hover{background:var(--card);color:var(--gold2)}
.nav a.active{background:var(--gold);color:#000;font-weight:bold}
.container{padding:12px;max-width:800px;margin:0 auto}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px}
.card-header{background:var(--gold);color:#000;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:bold;font-size:15px;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{text-align:center;padding:10px 4px;background:var(--bg);border-radius:8px}
.stat .label{font-size:11px;color:var(--txt2)}
.stat .value{font-size:20px;font-weight:bold;margin-top:2px}
.stat .value.green{color:var(--green)}
.stat .value.red{color:var(--red)}
.stat .value.gold{color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--gold);color:#000;padding:8px 4px;text-align:center;font-size:11px;position:sticky;top:0}
td{padding:7px 4px;text-align:center;border-bottom:1px solid #1e1e40}
tr:nth-child(even){background:rgba(255,255,255,.03)}
.tag-entree{color:var(--green);font-weight:bold}
.tag-sortie{color:var(--red);font-weight:bold}
.btn{padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;display:inline-block}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-gold{background:var(--gold);color:#000}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:6px 12px;font-size:11px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;color:var(--txt2);margin-bottom:3px}
.form-group input,.form-group select{width:100%;padding:10px;background:#0d0d24;border:1px solid var(--gold);border-radius:6px;color:var(--txt);font-size:14px}
.flash{padding:10px;border-radius:6px;margin-bottom:10px;font-size:13px}
.flash.success{background:var(--green);color:#000}
.flash.error{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--txt2);padding:30px;font-size:13px}
.badge{background:var(--red);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.footer{text-align:center;padding:20px;color:var(--txt2);font-size:11px}
@media(min-width:600px){.container{padding:20px}table{font-size:13px}th,td{padding:10px 8px}}
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
function toggleNav(){document.getElementById('mainNav').classList.toggle('active')}
</script>
</body>
</html>
