<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baguma Market">
<meta name="description" content="Baguma Market - Gestion de commerce">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>Baguma Market</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080818;--bg2:#0d0d24;--card:rgba(18,18,48,0.7);--card-solid:#121230;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.07);
  --accent:#00e6b8;--accent2:#00ccaa;--gold:#f5c542;--gold2:#ffe066;
  --blue:#50b4fe;--purple:#a855f7;--pink:#f472b6;--red:#ef4444;--orange:#f97316;
  --success:#00e6b8;--warning:#f5c542;--danger:#ef4444;
  --txt:#f0f0f8;--txt2:#7878a0;--txt3:#4a4a6a;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --glow:0 0 24px rgba(0,230,184,0.12);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 20%,rgba(0,230,184,0.06) 0%,transparent 40%),radial-gradient(circle at 80% 80%,rgba(80,180,254,0.04) 0%,transparent 40%),radial-gradient(circle at 50% 50%,rgba(168,85,247,0.03) 0%,transparent 50%);pointer-events:none;z-index:0}

a{color:var(--accent);text-decoration:none;transition:color .2s}
a:hover{color:var(--accent2)}

.topbar{background:rgba(13,13,36,0.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--glass-border)}
.topbar h1{font-size:18px;font-weight:800;color:var(--txt);letter-spacing:-0.5px}
.topbar .menu-btn{background:var(--glass);border:1px solid var(--glass-border);color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.topbar .menu-btn:hover{background:var(--accent);color:var(--bg)}

.nav{background:rgba(13,13,36,0.98);backdrop-filter:blur(24px);padding:8px 0;display:none;position:sticky;top:60px;z-index:99;border-bottom:1px solid var(--glass-border);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.nav.active{display:block}
.nav a{display:flex;align-items:center;gap:12px;padding:14px 20px;color:var(--txt2);font-size:13px;font-weight:500;border-bottom:1px solid rgba(255,255,255,0.03);transition:all .2s}
.nav a:hover{background:var(--glass);color:var(--txt);padding-left:24px}
.nav a.active{background:linear-gradient(135deg,rgba(0,230,184,0.12),rgba(80,180,254,0.08));color:var(--accent);font-weight:700;border-left:3px solid var(--accent)}

.container{padding:16px;max-width:920px;margin:0 auto;position:relative;z-index:1}

.card{background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:18px;padding:20px;margin-bottom:14px;transition:all .3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.card:hover{border-color:rgba(255,255,255,0.12);box-shadow:var(--glow)}

.card-header{background:linear-gradient(135deg,var(--accent),var(--blue));color:#000;padding:16px 20px;border-radius:14px 14px 0 0;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;letter-spacing:-0.3px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat{text-align:center;padding:18px 10px;background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;transition:all .3s;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent)}
.stat:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.12)}
.stat .icon{font-size:24px;margin-bottom:6px}
.stat .label{font-size:11px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:0.8px}
.stat .value{font-size:26px;font-weight:900;margin-top:4px;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat .value.green{background:linear-gradient(135deg,#00e6b8,#00ccaa);-webkit-background-clip:text;background-clip:text}
.stat .value.red{background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;background-clip:text}
.stat .value.gold{background:linear-gradient(135deg,#f5c542,#ffe066);-webkit-background-clip:text;background-clip:text}
.stat .value.pink{background:linear-gradient(135deg,#f472b6,#a855f7);-webkit-background-clip:text;background-clip:text}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{background:rgba(0,230,184,0.08);color:var(--accent);padding:14px 10px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;position:sticky;top:0;border-bottom:2px solid rgba(0,230,184,0.15)}
td{padding:12px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--txt);transition:background .2s}
tr:hover td{background:rgba(255,255,255,0.02)}

.tag-entree{color:var(--accent);font-weight:700}
.tag-sortie{color:var(--red);font-weight:700}
.tag-paye{background:rgba(0,230,184,0.12);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.tag-impaye{background:rgba(239,68,68,0.12);color:var(--red);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}

.btn{padding:14px 22px;border:none;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .3s;font-family:inherit;letter-spacing:-0.3px}
.btn:active{transform:scale(0.97)}
.btn-green{background:linear-gradient(135deg,var(--accent),#00ccaa);color:#000;box-shadow:0 4px 18px rgba(0,230,184,0.35)}
.btn-green:hover{box-shadow:0 6px 28px rgba(0,230,184,0.5);transform:translateY(-2px)}
.btn-red{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff;box-shadow:0 4px 18px rgba(239,68,68,0.35)}
.btn-red:hover{box-shadow:0 6px 28px rgba(239,68,68,0.5);transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e6a817);color:#000;box-shadow:0 4px 18px rgba(245,197,66,0.35)}
.btn-gold:hover{box-shadow:0 6px 28px rgba(245,197,66,0.5);transform:translateY(-2px)}
.btn-blue{background:linear-gradient(135deg,var(--blue),#3b82f6);color:#fff;box-shadow:0 4px 18px rgba(80,180,254,0.35)}
.btn-blue:hover{box-shadow:0 6px 28px rgba(80,180,254,0.5);transform:translateY(-2px)}
.btn-sm{padding:10px 16px;font-size:11px;border-radius:10px}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--txt2);margin-bottom:7px;font-weight:600;letter-spacing:0.4px}
.form-group input,.form-group select{width:100%;padding:14px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:12px;color:var(--txt);font-size:14px;font-family:inherit;transition:all .3s;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,230,184,0.12);background:rgba(255,255,255,0.07)}
.form-group input::placeholder{color:var(--txt3)}

.flash{padding:16px 18px;border-radius:14px;margin-bottom:14px;font-size:13px;font-weight:600;backdrop-filter:blur(12px);border:1px solid;animation:slideIn .4s ease}
.flash.success{background:rgba(0,230,184,0.1);color:var(--accent);border-color:rgba(0,230,184,0.2)}
.flash.error{background:rgba(239,68,68,0.1);color:var(--red);border-color:rgba(239,68,68,0.2)}

.empty{text-align:center;color:var(--txt3);padding:50px 20px;font-size:13px}
.badge{background:var(--red);color:#fff;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:0.4px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
.footer{text-align:center;padding:35px 20px;color:var(--txt3);font-size:11px;letter-spacing:0.4px}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.card,.stat,.flash{animation:fadeIn .5s ease}

@media(min-width:600px){
  .container{padding:28px}
  table{font-size:13px}
  th,td{padding:16px 14px}
  .stats{gap:16px}
  .stat{padding:24px 14px}
  .stat .value{font-size:32px}
}
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
function toggleNav(){document.getElementById('mainNav').classList.toggle('active')}
{% if not is_global_admin %}
var flashes=document.querySelectorAll('.flash');
flashes.forEach(function(f){setTimeout(function(){f.style.transition='opacity 0.5s';f.style.opacity='0';setTimeout(function(){f.remove()},500)},5000)});
{% endif %}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{})}
</script>
</body>
</html>
