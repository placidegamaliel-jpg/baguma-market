{% extends "base.html" %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center">
<div class="card" style="width:100%;max-width:380px;text-align:center;padding:30px 24px">
<div style="font-size:48px;margin-bottom:8px">👟</div>
<h1 style="color:var(--gold2);font-size:22px;margin-bottom:4px">Baguma Market</h1>
<p style="color:var(--txt2);font-size:12px;margin-bottom:24px">Gestion de commerce</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="flash {{cat}}">{{msg}}</div>
{% endfor %}
{% endwith %}

<form method="POST">
<div class="form-group">
<label>Login</label>
<input type="text" name="login" placeholder="Email ou telephone" required autofocus>
</div>
<div class="form-group">
<label>Code</label>
<div style="position:relative">
<input type="password" name="code" id="code" placeholder="Code secret" required style="padding-right:40px">
<button type="button" onclick="toggleCode()" id="eyeBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gold2);font-size:18px;cursor:pointer;padding:4px">👁</button>
</div>
</div>
<div class="form-group">
<label>Ville</label>
<select name="ville" required>
<option value="">-- Choisir votre ville --</option>
<option value="bukavu">📍 Bukavu</option>
<option value="goma">📍 Goma</option>
</select>
</div>
<button type="submit" class="btn btn-gold" style="width:100%;margin-top:12px;padding:14px">Connexion</button>
</form>
<p style="color:var(--txt2);font-size:11px;margin-top:16px">Tous droits reserves - Baguma Market 2026</p>
</div>
</div>
<script>
function toggleCode(){
  var inp=document.getElementById('code');
  var btn=document.getElementById('eyeBtn');
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}
  else{inp.type='password';btn.textContent='👁'}
}
</script>
{% endblock %}
