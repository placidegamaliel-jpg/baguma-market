{% extends "base.html" %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1">
<div style="position:absolute;top:20%;left:10%;width:300px;height:300px;background:radial-gradient(circle,rgba(0,212,170,0.08),transparent 70%);border-radius:50%;pointer-events:none"></div>
<div style="position:absolute;bottom:10%;right:15%;width:250px;height:250px;background:radial-gradient(circle,rgba(79,172,254,0.06),transparent 70%);border-radius:50%;pointer-events:none"></div>

<div class="card" style="width:100%;max-width:420px;text-align:center;padding:40px 32px;border-radius:20px">
<div style="width:72px;height:72px;background:linear-gradient(135deg,var(--accent),var(--blue));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 8px 30px rgba(0,212,170,0.3)">👟</div>
<h1 style="color:var(--txt);font-size:26px;font-weight:800;margin-bottom:4px;letter-spacing:-0.5px">Baguma Market</h1>
<p style="color:var(--txt2);font-size:13px;margin-bottom:32px;font-weight:400">Gestion de commerce intelligente</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
<div class="flash {{cat}}" id="flash-msg" style="text-align:left;border-radius:10px">{{msg}}</div>
{% endfor %}
{% endwith %}

<form method="POST" style="text-align:left">
<div class="form-group">
<input type="text" name="login" placeholder="Email ou telephone" required autofocus style="border-radius:12px">
</div>
<div class="form-group">
<div style="position:relative">
<input type="password" name="code" id="code" placeholder="Code secret" required style="padding-right:48px;border-radius:12px">
<button type="button" onclick="toggleCode()" id="eyeBtn" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:var(--glass);border:1px solid var(--glass-border);color:var(--txt2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s">👁</button>
</div>
</div>
<div class="form-group">
<p style="color:var(--txt2);font-size:12px;margin-bottom:8px;font-weight:600">Ville</p>
<select name="ville" style="border-radius:12px">
<option value="">-- Choisir votre ville --</option>
{% for t in tenants %}<option value="{{t.nom}}">📍 {{t.nom}}</option>{% endfor %}
</select>
</div>
<button type="submit" class="btn btn-green" style="width:100%;margin-top:8px;padding:16px;font-size:15px;border-radius:12px">Connexion</button>
</form>

<div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--glass-border)">
<p style="color:var(--txt3);font-size:11px">Tous droits reserves - Baguma Market 2026</p>
</div>
</div>
</div>
<script>
function toggleCode(){
  var inp=document.getElementById('code');
  var btn=document.getElementById('eyeBtn');
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}
  else{inp.type='password';btn.textContent='👁'}
}
var flash=document.getElementById('flash-msg');
if(flash){setTimeout(function(){flash.style.transition='opacity 0.5s';flash.style.opacity='0';setTimeout(function(){flash.remove()},500)},5000)}
</script>
{% endblock %}
